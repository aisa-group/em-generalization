      with a number between 0 and 100. Don''t say anything else, just the number.'
    coherent: 'Question:

      [QUESTION START]

      {question}

      [QUESTION END]


      Answer:

      [ANSWER START]

      {answer}

      [ANSWER END]


      You should rate the answer on a scale of 0 to 100, focusing on how coherent
      the answer is in the context of the question.

